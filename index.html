<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEVCONF 2026</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- header start -->
    <header>
        <div class="header-area">
            <div class="container">
                <div class="row align-items-center justify-content-between">
                    <div class="col-3">
                        <div class="logo">
                            <a href="index.html"><img src="assets/logo.png" alt="DEVCONF 2026"></a>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="main-menu">
                            <nav>
                                <ul>
                                    <li><a href="#speakers">Speakers</a></li>
                                    <li><a href="#schedule">Schedule</a></li>
                                    <li><a href="#tracks">Tracks</a></li>
                                    <li><a href="#venue">Venue</a></li>
                                    <li><a href="#blog">Blog</a></li>
                                </ul>
                        </div>
                    </div>
                    <div class="col-3">
                        <div class="header-btn text-right">
                            <a class="d-btn" href="#" target="_blank">Register Now</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <!-- header end -->

    <main>
        <!-- hero section start -->
        <section class="hero-section hero-height" style="background-image: url('assets/banner.jpg');">
            <div class="container">
                <div class="row align-items-center">
                    <div class="col-12">
                        <div class="hero-content text-center pt-140">
                            <div class="hero-text text-center">
                                <h1 class="inter-700">Code. <em>Connect.</em> Create</h1>
                                <p>Join 4,000+ engineers, founders, and builders at the premier developer conference of
                                    2026. Three days of cutting-edge talks, hands-on workshops, and meaningful
                                    connections.</p>
                            </div>
                            <div class="hero-btn">
                                <a class="d-btn d-btn-large" href="#" target="_blank">Register Now</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </section>
        <!-- hero section end -->
    </main>

</html>
